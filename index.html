<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DHS POS</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;color:#18202b}
header{background:#fff;padding:18px;border-bottom:1px solid #ddd;font-weight:bold;font-size:22px}
main{padding:22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px}
button{background:#18bd52;color:#fff;border:0;border-radius:8px;padding:11px 16px}
@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>🟢 DHS POS — Dream Chaser Health Services</header>
<main>
<h1>Dashboard</h1>
<p>DHS POS mpya — mfumo tunaanza kutoka sifuri.</p>
<div class="cards">
<div class="card">Mauzo leo<br><h2>TZS 0</h2></div>
<div class="card">Faida leo<br><h2>TZS 0</h2></div>
<div class="card">Stock In<br><h2>0</h2></div>
<div class="card">Stock Out<br><h2>0</h2></div>
</div>
<br><button onclick="alert('Add Product itajengwa kwenye hatua inayofuata')">+ Add Product</button>
</main>
</body>
</html>
